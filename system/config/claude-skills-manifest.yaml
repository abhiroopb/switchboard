# Skills copied into ~/.claude/skills/<name>.
#
# Why this file exists: Claude Code loads skills only from ~/.claude/skills,
# project .claude/skills, --add-dir roots, and plugins. It never reads
# ~/.agents/skills. Amp reads ~/.agents/skills first, then project skill
# folders, then ~/.claude/skills, and the first `name` wins. So one copy in
# ~/.claude/skills serves both agents only while ~/.agents/skills holds no
# second copy of the same skill: sync-skills.py moves old repo copies there to
# the trash and keeps only an external managed library and todo.
# Skills are copied, never symlinked.
#
# ~/.claude/skills is output only, like a build folder. Edit the source, never
# the copy. system/scripts/sync-skills.py copies changed skills on every
# command-center tick and right after a branch lands on main, always from the
# main checkout. Claude sees an edit in a running session; Amp in its next new
# thread. An edited installed copy is saved to local/skill-edits/ and replaced
# by the source, so it never sticks and is never lost.
#
# Commands (run from the main switchboard checkout):
#   python3 system/scripts/sync-skills.py                      # the full sync, as the tick runs it
#   python3 system/scripts/install-claude-skills.py --check    # list drift, exit 1 when any
#   python3 system/scripts/install-claude-skills.py --prune    # remove managed copies not listed here (cap 5)
#   python3 system/scripts/install-claude-skills.py vendor <name>  # refresh a third-party copy
#
# Entry fields:
#   name      directory name under the destination (and under the source root).
#             It must equal the SKILL.md frontmatter `name`, because Claude reads
#             the folder name and Amp the frontmatter; --check fails otherwise.
#   source    switchboard   -> <repo>/.agents/skills/<name>
#             agents  -> ~/.agents/skills/<name>   (external managed skill library)
#             vendor  -> <repo>/system/vendor/skills/<name> (pinned third-party copy)
#             local   -> <repo>/local/skills/<name> (private, gitignored, out of the kit)
#   vendor entries also carry repo, ref (commit sha), path (subdirectory that
#   holds SKILL.md), license, reviewed (date of the safety review), and optional
#   drop (paths to delete) and edits ({files, find, replace}) applied after the
#   copy so the vendored tree is reproducible from this file alone.
#   pattern   glob instead of name; expands to every skill dir under the source
#             root that matches (an explicit name entry wins over a pattern).
#   listing   on (default) | name-only | user-invocable-only | off. Written to
#             skillOverrides in ~/.claude/settings.json so a large family costs
#             Claude one line per skill instead of its full description.
#   absent_ok_on  sys.platform values (for example [win32]) where this entry may
#             have no source. It stays dormant there and a plain run still passes.
#             Everywhere else, and for entries without it, a missing source fails.
#             firecrawl self-installs on demand, so its entries carry it.
#   machine_gate  on a pattern entry: a key that must be on for this machine, in the
#             environment or in local/machines/<MACHINE>.env. Off by default, so a
#             machine that was never switched on installs nothing from this pattern,
#             even when a sync client has copied the source folder to it.
#   A dormant pattern (missing or empty root, closed gate) never counts as a delete:
#   --prune keeps the copies that came from it.
#
# Listing budget: Claude shows full descriptions up to
# 200000 tokens x 4 x skillListingBudgetFraction characters (default 0.01 =
# 8000 chars) and truncates the rest to name-only. The core set below needs
# about 24k chars, the vendor set 15k, the two name-only families 4.5k, so
# claude_settings raises the fraction to 0.06 (48k chars, about 12k tokens of
# system prompt per session). Recompute when adding full entries:
#   sum(min(len(description), 1536) + len(name) + 6) over listing: on entries.
#
# Third-party review: each vendor entry below passed a read of its SKILL.md,
# scripts, and hooks for network calls, telemetry, credential access, and
# AGENTS.md writes before it was pinned.

destination: ~/.claude/skills

sources:
  switchboard: .agents/skills
  agents: ~/.agents/skills
  vendor: system/vendor/skills
  local: local/skills

# Keys merged into ~/.claude/settings.json by the installer (see Listing budget).
claude_settings:
  skillListingBudgetFraction: 0.06

# Shared text for the Anthropic knowledge-work skills, which point at a
# CONNECTORS.md two levels up that is not vendored.
x-kwp-connectors: &kwp-connectors
  files: SKILL.md
  find: "> If you see unfamiliar placeholders or need to check which tools are connected, see [CONNECTORS.md](../../CONNECTORS.md)."
  replace: "> Connected tools in switchboard: the `switchboard` connectors (Slack, Gmail, Google Drive, Calendar). Read `~/Development/switchboard/knowledge/` before drafting."
x-kwp-args: &kwp-args
  files: SKILL.md
  find: "$ARGUMENTS"
  replace: "<input>"

skills:
  # ── switchboard core set from the external skill library under ~/.agents/skills ──
  # todo carries the tracked override in system/skill-overrides/todo, which
  # sync-skills.py applies before every copy. Add a name here when it joins
  # CORE_SKILLS in system/bin/install-amp-skills.sh and switchboard depends on it.
  - {name: todo, source: agents}

  # ── switchboard owned skills ──────────────────────────────────────────────
  # Canonical copies live in this repo under .agents/skills. One pattern installs
  # every folder there that holds a SKILL.md, so a new skill needs no edit here.
  # Named entries below keep a per-machine rule: an entry's only_on also stops the
  # pattern from bringing that skill back elsewhere, and absent_ok_on lists the
  # skills a machine may lack. A named entry always wins over a pattern match
  # for the same name.
  - {pattern: "*", source: switchboard}


  # ── Large families: directory skill full, members name-only ─────────
  # The family's directory skill keeps its description so Claude knows the
  # family exists; members list by name only and load on demand.
  - {name: firecrawl, source: agents, absent_ok_on: [win32]}
  - {pattern: "firecrawl-*", source: agents, listing: name-only, absent_ok_on: [win32]}

