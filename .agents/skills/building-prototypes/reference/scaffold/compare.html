<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · compare</title>
<style>
  :root { --line: #e1e5ea; --muted: #5b6470; --accent: #0b5fff; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; color: #16191d; }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--muted); }
  header .spacer { flex: 1; }
  button { min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font: 600 14px inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .frames { display: flex; gap: 20px; padding: 20px; overflow-x: auto; align-items: flex-start; }
  figure { margin: 0; flex: 0 0 auto; }
  figcaption { margin-bottom: 8px; }
  figcaption span { color: var(--muted); margin-left: 6px; }
  iframe { border: 1px solid var(--line); border-radius: 10px; background: #fff; width: var(--w, 720px); height: 820px; }
  body[data-width="1440"] iframe { --w: 1440px; }
  body[data-width="720"] iframe { --w: 720px; }
  body[data-width="390"] iframe { --w: 390px; }
</style>
</head>
<body data-width="720">
<header>
  <h1>{{title}}: compare</h1>
  <span class="meta">generated {{date}}</span>
  <span class="spacer"></span>
  <span class="meta">Frame width</span>
  <button type="button" data-w="1440" aria-pressed="false">1440</button>
  <button type="button" data-w="720" aria-pressed="true">720</button>
  <button type="button" data-w="390" aria-pressed="false">390</button>
</header>
<div class="frames">
{{frames}}
</div>
<script>
  document.querySelectorAll("button[data-w]").forEach(b => b.addEventListener("click", () => {
    document.body.dataset.width = b.dataset.w;
    document.querySelectorAll("button[data-w]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));
</script>
</body>
</html>
