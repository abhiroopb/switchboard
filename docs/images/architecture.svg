<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How switchboard works</title>
  <desc id="d">You talk to the Chief of Staff. It dispatches each task to a worker in its own git worktree and terminal tab. Workers report back, and their branches land on your local main. The to-do list, workstream notes and routines are plain files.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="16" fill="#f8fafc"/>

  <!-- You -->
  <rect x="30" y="200" width="120" height="70" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="232" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">You</text>
  <text x="90" y="254" text-anchor="middle" font-size="13" fill="#475569">one chat thread</text>

  <!-- Chief of Staff -->
  <rect x="200" y="175" width="190" height="120" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="295" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">Chief of Staff</text>
  <text x="295" y="234" text-anchor="middle" font-size="13" fill="#3730a3">plans, routes, summarizes</text>
  <text x="295" y="254" text-anchor="middle" font-size="13" fill="#3730a3">relays worker questions</text>
  <text x="295" y="274" text-anchor="middle" font-size="13" fill="#3730a3">never does the work itself</text>

  <!-- Dispatcher -->
  <rect x="440" y="195" width="150" height="80" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="515" y="228" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Dispatcher</text>
  <text x="515" y="250" text-anchor="middle" font-size="12.5" fill="#475569">one branch, worktree</text>
  <text x="515" y="266" text-anchor="middle" font-size="12.5" fill="#475569">and tab per task</text>

  <!-- Workers -->
  <g>
    <rect x="650" y="60" width="270" height="78" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="668" y="90" font-size="15" font-weight="600" fill="#064e3b">Worker 1 · draft the planning doc</text>
    <text x="668" y="113" font-size="12.5" fill="#065f46">task/rt-1a2b · worktree · tab</text>
    <rect x="650" y="196" width="270" height="78" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="668" y="226" font-size="15" font-weight="600" fill="#064e3b">Worker 2 · review a pull request</text>
    <text x="668" y="249" font-size="12.5" fill="#065f46">task/rt-3c4d · worktree · tab</text>
    <rect x="650" y="332" width="270" height="78" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="668" y="362" font-size="15" font-weight="600" fill="#064e3b">Worker 3 · prep tomorrow's meeting</text>
    <text x="668" y="385" font-size="12.5" fill="#065f46">task/rt-5e6f · worktree · tab</text>
  </g>

  <!-- Arrows: you <-> CoS, CoS -> dispatcher -> workers -->
  <line x1="150" y1="226" x2="198" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="198" y1="246" x2="152" y2="246" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="390" y1="235" x2="438" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M590,220 C620,200 620,110 648,100" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="235" x2="648" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M590,250 C620,270 620,360 648,370" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Reports back -->
  <path d="M785,412 C785,470 300,470 295,298" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="560" y="488" text-anchor="middle" font-size="13" fill="#065f46">each worker reports one line back, then its branch lands on your local main</text>

  <!-- Files row -->
  <rect x="30" y="40" width="560" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="50" y="68" font-size="14" font-weight="600" fill="#0f172a">Plain files on your machine</text>
  <text x="50" y="94" font-size="13" fill="#334155">AGENTS.md policy · to-do list · workstreams/*/CONTEXT.md</text>
  <text x="50" y="116" font-size="13" fill="#334155">review notes (Obsidian) · start of day and end of day routines</text>
  <line x1="295" y1="142" x2="295" y2="173" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Guardrails -->
  <rect x="30" y="330" width="360" height="70" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="50" y="358" font-size="14" font-weight="600" fill="#7c2d12">Guardrails on every agent</text>
  <text x="50" y="381" font-size="12.5" fill="#9a3412">no force pushes · no unapproved sends · no stray deletes</text>
</svg>
